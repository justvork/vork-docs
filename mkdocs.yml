site_name: Vork Documentation
repo_url: https://github.com/justvork
repo_name: justvork

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Understanding Vork: understanding-vork.md
  - Tool Directory:
      - Overview: tool-directory/index.md
      - Reflection-generated tools: tool-directory/runtime-reflection-tools.md
      - Skill-generated tools: tool-directory/runtime-skill-tools.md
      - MCP binding tools: tool-directory/runtime-mcp-tools.md
    - Notifications:
      - Overview: notifications/index.md
      - Notification Basics: notifications/notification-basics.md
  - Docker Instructions:
      - Overview: docker-instructions.md
      - Database Options:
          - Nitrite (built-in): databases/nitrite.md
          - MongoDB: databases/mongodb.md
          - MongoDB Atlas: databases/mongodb-atlas.md
          - Redis: databases/redis.md
          - Couchbase: databases/couchbase.md

theme:
  name: material
  logo: assets/images/Vork-Header.png
  favicon: assets/images/Vork-Faviconx128.png
  palette:
    - scheme: slate
      primary: black
      accent: amber

extra_css:
  - assets/stylesheets/vork-theme.css
  - assets/stylesheets/vork-docs.css

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
